<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Chat App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #d9dbd5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Login Screen */
        .login-screen {
            width: 350px;
            max-width: 90%;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 25px #0002;
            text-align: center;
        }

        .login-screen h2 {
            color: #008069;
            margin-bottom: 20px;
        }

        .login-screen input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            outline: none;
            border-radius: 8px;
            font-size: 15px;
        }

        .login-screen button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #008069;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .login-screen button:hover {
            background: #006b58;
        }

        /* Main Chat App */
        .chat-app {
            width: 95%;
            max-width: 1100px;
            height: 90vh;
            display: none;
            background: white;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 5px 25px #0002;
        }

        .sidebar {
            width: 32%;
            min-width: 230px;
            background: white;
            border-right: 1px solid #ddd;
        }

        .sidebar-header {
            height: 65px;
            background: #008069;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .search {
            padding: 12px;
            background: #f0f2f5;
        }

        .search input {
            width: 100%;
            padding: 12px;
            border: none;
            outline: none;
            border-radius: 8px;
        }

        .contact {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px;
            border-bottom: 1px solid #eee;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #d9fdd3;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #008069;
        }
        .avatar img{
            border-radius: 20px;

        }
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            height: 65px;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
        }

        .chat-header h3 {
            font-size: 16px;
        }

        .status {
            color: #667781;
            font-size: 12px;
            margin-top: 4px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: #efeae2;
            background-image: radial-gradient(#ffffff70 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 75%;
            padding: 10px 12px;
            border-radius: 8px;
            background: white;
            align-self: flex-start;
            overflow-wrap: anywhere;
            box-shadow: 0 1px 1px #0001;
        }

        .message.mine {
            background: #d9fdd3;
            align-self: flex-end;
        }

        .sender {
            color: #008069;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.4;
        }

        .input-area {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: #f0f2f5;
        }

        .input-area input {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: none;
            outline: none;
            border-radius: 8px;
            font-size: 14px;
        }

        .input-area button {
            border: none;
            background: #008069;
            color: white;
            padding: 13px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .input-area button:hover {
            background: #006b58;
        }

        @media (max-width: 600px) {
            .chat-app {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .sidebar {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <h2>Himanshu"s Global ChatBox</h2>

        <form id="loginForm">
            <input
                type="text"
                id="loginName"
                placeholder="Enter your name"
                maxlength="30"
                autocomplete="name"
                required
            >

            <button type="submit" id="loginBtn">Login</button>
        </form>
    </div>

    <!-- Chat App -->
    <div class="chat-app" id="chatApp">

        <aside class="sidebar">
            <div class="sidebar-header">My Chat App</div>

            <div class="search">
                <input type="text" placeholder="Search chats">
            </div>

            <div class="contact">
                <div class="avatar">G</div>
                <div>
                    <strong>Global Chat</strong>
                    <p class="status">Chat with everyone</p>
                </div>
            </div>
        </aside>

        <main class="chat-section">

            <div class="chat-header">
                <div class="avatar"><img src="HP.jpeg" alt="" height="45px" width="45px"></div>
                <div>
                    <h3>Global Chat</h3>
                    <p class="status" id="connectionStatus">Connecting...</p>
                </div>
            </div>

            <div class="messages" id="messages"></div>

            <form class="input-area" id="messageForm">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type a message..."
                    autocomplete="off"
                    required
                >

                <button type="submit" id="sendBtn">Send</button>
            </form>

        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();

        const loginScreen = document.querySelector("#loginScreen");
        const loginForm = document.querySelector("#loginForm");
        const loginName = document.querySelector("#loginName");
        const loginBtn = document.querySelector("#loginBtn");

        const chatApp = document.querySelector("#chatApp");
        const messageForm = document.querySelector("#messageForm");
        const messageInput = document.querySelector("#messageInput");
        const messages = document.querySelector("#messages");

        const connectionStatus = document.querySelector("#connectionStatus");

        // Current user's name
        let username = "";

        // Connection status
        socket.on("connect", () => {
            connectionStatus.textContent = "Connected";
        });

        socket.on("disconnect", () => {
            connectionStatus.textContent = "Disconnected";
        });

        // Login
        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();

            const name = loginName.value.trim();

            if (!name) {
                alert("Please enter your name");
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = "Logging in...";

            socket.emit("login", name);
        });

        // Login successful
        socket.on("loginSuccess", (name) => {
            username = name;

            loginScreen.style.display = "none";
            chatApp.style.display = "flex";
        });

        // Login error
        socket.on("loginError", (error) => {
            alert(error);

            loginBtn.disabled = false;
            loginBtn.textContent = "Login";
        });

        // Send message
        messageForm.addEventListener("submit", (e) => {
            e.preventDefault();

            const message = messageInput.value.trim();

            if (!message || !username) return;

            // Only message is sent.
            // Username is already stored on the server.
            socket.emit("message", message);

            messageInput.value = "";
        });

        // Receive messages
        socket.on("message", (data) => {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message");

            // Check whether this message is from current user
            if (data.senderId === socket.id) {
                messageDiv.classList.add("mine");
            }

            const sender = document.createElement("div");
            sender.classList.add("sender");
            sender.textContent = data.username;

            const text = document.createElement("div");
            text.classList.add("message-text");
            text.textContent = data.message;

            messageDiv.appendChild(sender);
            messageDiv.appendChild(text);

            messages.appendChild(messageDiv);

            // Scroll to latest message
            messages.scrollTop = messages.scrollHeight;
        });
    </script>

</body>
</html>
